name: Deploy roadworks receiver
# Deploys the Cloudflare Worker in ./worker, which receives Street Manager open data from DfT. Needs three repository
# secrets (Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and DRAIN_TOKEN.
# Without them the job still runs the tests and records that nothing was deployed. After a deploy it probes the live
# receiver and commits the result (including the unit-test outcome) to worker/deploy_check.json.
on:
  workflow_dispatch:
  push:
    paths: ["worker/**"]
permissions:
  contents: write
concurrency:
  group: deploy-receiver
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DRAIN: ${{ secrets.DRAIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unit tests
        id: tests
        run: node --test worker/test/receiver.test.mjs
      - name: Deploy to Cloudflare
        id: deploy
        if: ${{ env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && env.DRAIN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            DRAIN_TOKEN
        env:
          DRAIN_TOKEN: ${{ secrets.DRAIN_TOKEN }}
      - name: Probe the live receiver
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          OUT: ${{ steps.deploy.outputs.command-output }}
          DEPLOYED: ${{ steps.deploy.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: python3 worker/smoke.py
      - name: Commit the result
        if: always()
        run: |
          git config user.name "statute-feed"
          git config user.email "feed@users.noreply.github.com"
          git add worker/deploy_check.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "check: roadworks receiver deploy result"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 10; done
          exit 1
