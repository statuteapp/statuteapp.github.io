name: Build postcode lookup
# Official ONS Postcode Directory -> pc/<OUTWARD>.json, so the phone never needs a third-party lookup service.
# ONS publishes a new release every quarter; checking weekly picks it up within days. Does nothing if unchanged.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      item:
        description: "Optional ArcGIS item id of a specific ONSPD release (from the ONS Open Geography Portal page)"
        required: false
        default: ""
      force:
        description: "Rebuild even if this release was already built"
        type: boolean
        default: false
  push:
    paths: ["build_postcodes.py"]
permissions:
  contents: write
concurrency:
  group: postcodes
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build pc/ from the newest ONSPD release
        env:
          ITEM: ${{ github.event.inputs.item }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          if [ -n "$ITEM" ]; then
            if ! echo "$ITEM" | grep -Eq '^[0-9a-f]{32}$'; then echo "item must be a 32-character ArcGIS item id"; exit 1; fi
            ARGS="--item $ITEM"
          fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python build_postcodes.py $ARGS
      - name: Commit if changed
        run: |
          git config user.name "statute-feed"
          git config user.email "feed@users.noreply.github.com"
          git add -A pc
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "postcodes: ONS Postcode Directory $(python -c 'import json;print(json.load(open("pc/meta.json"))["release"])')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 10; done
          exit 1
