name: Check Street Manager converter on real archive
# Read-only check of the converter, plus a small labelled sample of real archive data for squares around Slough, published
# in ./roadworks so the Roadworks screen can be reviewed before the live feed exists. Runs when tools/sm_check.py changes.
on:
  workflow_dispatch:
  push:
    paths: ["tools/sm_check.py"]
permissions:
  contents: write
concurrency:
  group: sm-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unit tests
        run: python tools/test_streetworks.py
      - name: Run the converter over the real archive
        env:
          SM_DEMO_DIR: roadworks
        run: python tools/sm_check.py
      - name: Commit the summary and the sample
        if: always()
        run: |
          git config user.name "statute-feed"
          git config user.email "feed@users.noreply.github.com"
          git add tools/sm_check_result.json
          if [ -d roadworks ]; then git add -A roadworks; fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "check: Street Manager converter on real archive (archive sample for Slough area)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 10; done
          exit 1
