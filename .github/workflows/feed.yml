name: Build feed
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths: ["build_feed.py"]
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build items.json
        id: build
        run: python build_feed.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "statute-feed"
          git config user.email "feed@users.noreply.github.com"
          git add items.json status.json
          git diff --cached --quiet && echo "no change" || git commit -m "feed: $(date -u +%Y-%m-%dT%H:%M)Z" && git push
      - name: Raise the alarm if a source has been down for a day
        if: steps.build.outcome == 'failure'
        run: exit 1
