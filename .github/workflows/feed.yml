name: Build feed
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths: ["build_feed.py", "apply_patches.py", "patches/**"]
permissions:
  contents: write
concurrency:
  group: feed
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Apply queued app patches (apply_patches.py, then one file per round in patches/; idempotent)
        run: |
          python apply_patches.py
          for f in patches/*.py; do [ -f "$f" ] && python "$f"; done
        continue-on-error: true
      - name: Build items.json
        id: build
        run: python build_feed.py
        continue-on-error: true
      - name: Build crime points (separate, so a failure here can never stop the feed)
        run: python tools/crime_points.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "statute-feed"
          git config user.email "feed@users.noreply.github.com"
          git add items.json status.json index.html
          if [ -f fsa_places.json ]; then git add fsa_places.json; fi
          if [ -f crime_points.json ]; then git add crime_points.json; fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "feed: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Another commit (a person's push, or the postcode build) can land while this run is working.
          # Pull it in and retry instead of failing the whole run.
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 10; done
          exit 1
      - name: Raise the alarm if a source has been down for a day
        if: steps.build.outcome == 'failure'
        run: exit 1
