name: Restore index
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-index.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-index
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Restore real build_feed.py from 92a1798 (replaced by a stub in 372a41a)
        run: |
          set -e
          git checkout 92a1798 -- build_feed.py
          size=$(wc -c < build_feed.py)
          echo "restored build_feed.py size: $size"
          test "$size" -gt 30000
          grep -q '^def main' build_feed.py
          python -m py_compile build_feed.py
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add build_feed.py
          git commit -m "Restore real build_feed.py (92a1798); 372a41a had replaced it with a stub"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
