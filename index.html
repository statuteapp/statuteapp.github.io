<html lang="en-GB">
<head>

<style>
:root{
  --paper:#ffffff;--paper-2:#f3f2f1;--paper-3:#e8e7e4;--ink:#0b0c0c;--slate:#505a5f;--mist:#b1b4b6;
  --blue:#1d70b8;--blue-bg:#e5effa;--green:#00703c;--green-bg:#e4f1ea;--red:#d4351c;--red-bg:#fbe9e5;--amber:#f47738;--amber-bg:#fdeee4;--purple:#4c2c92;--purple-bg:#ede9f6;
  --radius:4px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121314;--paper-2:#1c1e20;--paper-3:#2a2d30;--ink:#f3f2f1;--slate:#b1b4b6;--mist:#505a5f;
  --blue:#5694ca;--blue-bg:#15283a;--green:#3fa36b;--green-bg:#13301f;--red:#ec7d6a;--red-bg:#3a1a14;--amber:#f7a26c;--amber-bg:#3b2414;--purple:#a28bd9;--purple-bg:#261c3d;
}}
:root[data-theme="dark"]{
  --paper:#121314;--paper-2:#1c1e20;--paper-3:#2a2d30;--ink:#f3f2f1;--slate:#b1b4b6;--mist:#505a5f;
  --blue:#5694ca;--blue-bg:#15283a;--green:#3fa36b;--green-bg:#13301f;--red:#ec7d6a;--red-bg:#3a1a14;--amber:#f7a26c;--amber-bg:#3b2414;--purple:#a28bd9;--purple-bg:#261c3d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--paper-2);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
.app{max-width:560px;margin:0 auto;min-height:100%;background:var(--paper);display:flex;flex-direction:column;position:relative}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--paper-3);padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:20px;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
.brand .mark{width:14px;height:22px;background:var(--ink);border-radius:2px;position:relative}
.brand .mark::after{content:"";position:absolute;left:3px;right:3px;top:4px;height:3px;background:var(--paper);box-shadow:0 6px 0 var(--paper),0 12px 0 var(--paper)}
.stamp{font-size:13px;color:var(--slate)}
main{flex:1;padding:0 0 84px}
.screen{display:none;padding:18px 20px 24px}
.screen.active{display:block}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-0.01em}
h2{font-size:19px;margin:28px 0 10px;font-weight:700}
h3{font-size:17px;margin:18px 0 6px;font-weight:700}
p{margin:0 0 12px}
.lede{color:var(--slate);font-size:16px;margin-bottom:18px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;line-height:1.5;white-space:nowrap}
.pill.must{background:var(--red-bg);color:var(--red)}
.pill.affects{background:var(--blue-bg);color:var(--blue)}
.pill.notice{background:var(--paper-3);color:var(--slate)}
.pill.inforce{background:var(--green-bg);color:var(--green)}
.pill.coming{background:var(--amber-bg);color:var(--amber)}
.pill.proposed{background:var(--purple-bg);color:var(--purple)}
.pill.kind{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor;font-weight:700}
.pill.kind.law{color:var(--ink)}.pill.kind.guidance{color:var(--blue)}.pill.kind.alert{color:var(--red)}.pill.kind.rates{color:var(--green)}.pill.kind.consult{color:var(--purple)}.pill.kind.update{color:var(--slate)}.pill.kind.record{color:var(--mist)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chips button{border:1.5px solid var(--mist);background:transparent;border-radius:16px;padding:4px 11px;font-size:13.5px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px;margin:8px 0 0;align-items:center}
.lgrid{display:grid;grid-template-columns:1fr;gap:6px;margin:6px 0 0}
.lg{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:start;font-size:14.5px;padding:8px 10px;border:1px solid var(--paper-3);border-radius:8px;background:var(--paper)}
.lg.hi{border-color:var(--amber);background:var(--amber-bg)}
.lg>b{font-size:15px}
abbr.ab{text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer}
.hbtns{display:flex;gap:6px;flex:none}
.hb{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--paper-3);background:transparent;font-weight:700;cursor:pointer;font-size:15px;line-height:1}
.hb.on{border-color:var(--ink);background:var(--paper-2)}
.rank{min-width:0}.rank .bar{width:90px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-in{background:var(--paper);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet .opt{display:block;width:100%;text-align:left;padding:12px 10px;border:0;border-top:1px solid var(--paper-3);background:transparent;cursor:pointer;font-size:16px}
.sheet .opt .lead{display:block}
.bm{border:1.5px solid var(--paper-3);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;margin-left:auto}
.bm.on{border-color:var(--ink);background:var(--paper-2)}
.card .meta .bmc{margin-left:6px;cursor:pointer;font-size:14px;opacity:.55}.card .meta .bmc.on{opacity:1}
.pdfb{font-size:13px;color:var(--slate)}
.pill.near{background:var(--green-bg);color:var(--green)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}.dot.ok{background:var(--green)}.dot.warn{background:var(--amber)}
@media print{
  header.top,nav.tabs,.hbtns,.sheet,.toast,#confetti,#padhud,.back,.bm,.audio,.chips,.btn,.bmc,.quiz,.brief,.clock,.meas,.areas,.setnav{display:none !important}
  body,.app{background:#fff;color:#000}.app{max-width:none}
  .screen{display:none}.screen.active{display:block;padding:0}
  .card{break-inside:avoid;border:1px solid #999;border-left-width:6px;box-shadow:none}
  a{color:#000;text-decoration:none}a[href^="http"]::after{content:" (" attr(href) ")";font-size:11px;color:#444}
  details.rib{break-inside:avoid}
  .printhead{display:block !important;font-size:12px;color:#444;border-bottom:1px solid #999;margin-bottom:12px;padding-bottom:6px}
  .printfoot{display:block !important;font-size:11px;color:#444;border-top:1px solid #999;margin-top:16px;padding-top:6px}
}
.printhead,.printfoot{display:none}
.skip{position:absolute;left:-999px;top:8px;z-index:20;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:4px}.skip:focus{left:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1:focus{outline:none}
.onbhead{margin:0 0 14px}.onbhead .prog{height:6px;background:var(--paper-3);border-radius:3px;overflow:hidden;margin-top:4px}.onbhead .prog i{display:block;height:100%;background:var(--ink)}
.cq{border:0;padding:0;margin:0 0 18px}.cq legend{font-weight:700;margin-bottom:6px;padding:0}.cq legend .lead{font-weight:400}
.copt{display:grid;grid-template-columns:24px 1fr;gap:2px 10px;align-items:start;border:1.5px solid var(--paper-3);border-radius:10px;padding:10px 12px;margin:0 0 6px;cursor:pointer;background:var(--paper)}
.copt.on{border-color:var(--ink);background:var(--paper-2)}.copt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ink)}.copt .l{font-size:16px}.copt .r{grid-column:2;font-size:13px;color:var(--green)}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{transition:none !important;animation:none !important;scroll-behavior:auto !important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none !important;animation:none !important}}
.high-contrast{--paper:#fff;--paper-2:#f4f4f4;--paper-3:#8a8a8a;--ink:#000;--slate:#1a1a1a;--mist:#444;--blue:#0000d0;--green:#005a2b;--red:#b00000;--amber:#8a3b00;--purple:#3a1a80;--blue-bg:#dbe6ff;--green-bg:#d6f0df;--red-bg:#ffd9d9;--amber-bg:#ffe4cc;--purple-bg:#e4dbff}
.high-contrast[data-theme="dark"],.high-contrast.dark{--paper:#000;--paper-2:#111;--paper-3:#9a9a9a;--ink:#fff;--slate:#f0f0f0;--mist:#bbb;--blue:#8ab4ff;--green:#7fe0a6;--red:#ff8d8d;--amber:#ffbf80;--purple:#c9b3ff}
.high-contrast .card,.high-contrast .asi,.high-contrast .syltile,.high-contrast .lg,.high-contrast .copt{border-color:var(--ink)}
button,.card,.tag,.hb,.bm,.chips button,.seg button{min-height:44px}.tag,.chips button,.seg button,.bm{min-height:36px}.hb{min-width:44px;min-height:44px;width:44px;height:44px}
nav.tabs button{min-height:52px}
.pill.who{background:var(--paper-2);color:var(--ink);font-weight:600}
.whorow{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.card .foot .src{font-size:12.5px;color:var(--slate)}.card .foot .lnkd{color:var(--blue)}
.card .foot .tags{margin:0}
.card .meta .when{margin-left:auto}
.nolink{font-style:italic}
.also{margin-top:10px;font-size:14px;border-top:1px dashed var(--paper-3);padding-top:8px}.also>div{padding:2px 0}
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin:6px 0 4px}
.sub{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--paper-3);border-radius:8px;padding:8px 10px;font-size:14.5px;background:var(--paper)}.sub .ic{font-size:18px;line-height:1.2}.sub.muted{opacity:.7}
h2 a[data-go]{color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.sylgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0 12px}
.syltile{text-align:left;border:1.5px solid var(--paper-3);border-radius:10px;padding:10px 12px;background:var(--paper);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.syltile[aria-expanded="true"]{border-color:var(--ink)}.syltile.done{border-color:var(--green)}
.syltile .ic{font-size:22px}.syltile .t{font-weight:700;line-height:1.25}
.syltile .prog{display:block;height:4px;background:var(--paper-3);border-radius:2px;overflow:hidden;margin-top:4px}.syltile .prog i{display:block;height:100%;background:var(--green)}
.confirm{background:var(--paper-2);border-left:6px solid var(--blue);padding:12px 14px;border-radius:0 4px 4px 0;margin:14px 0}
.confirm .big{font-size:18px;font-weight:700;margin:2px 0 6px}
.calc{background:var(--paper-2);border-radius:8px;padding:14px;margin:12px 0 0}
.calc .ins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.calc .ins label{font-size:13px;color:var(--slate);display:block}
.calc .ins input{width:100%;padding:8px;border:2px solid var(--ink);border-radius:4px;background:var(--paper);font-size:17px}
.calc .out{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.calc .out .v{font-size:24px;font-weight:700}
.calc .out .l{font-size:12.5px;color:var(--slate)}
.calc .out .arrow{font-size:20px;color:var(--slate)}
.calc .diff{text-align:center;margin:10px 0 0;font-weight:700}
.calc .diff.up{color:var(--red)}.calc .diff.down{color:var(--green)}
.role{border:1px solid var(--paper-3);border-radius:8px;padding:12px 14px;margin:0 0 10px}
.role .h{font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.role table{margin-top:8px}
.role td:first-child{width:52%}
.duty{font-size:12.5px;font-weight:700;padding:1px 7px;border-radius:3px;white-space:nowrap}
.duty.you{background:var(--red-bg);color:var(--red)}.duty.emp{background:var(--blue-bg);color:var(--blue)}.duty.both{background:var(--amber-bg);color:var(--amber)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.tag{border:0;background:var(--paper-2);color:var(--blue);border-radius:4px;padding:2px 8px;font-size:13px;cursor:pointer;font-weight:700}
.tag.p{background:var(--blue-bg)}
.tag:hover{text-decoration:underline}
.gtable{margin:10px 0 0;border:1px solid var(--paper-3);border-radius:8px;overflow:hidden}
.gtable .cap{padding:8px 12px;font-weight:700;font-size:15px;background:var(--paper-2)}
.gtable table{font-size:14.5px}.gtable th{font-weight:700;color:var(--ink)}
.gtable .src{padding:6px 12px 8px;font-size:12.5px}
.tree details{border-top:1px solid var(--paper-3)}
.tree summary{padding:10px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.tree summary::-webkit-details-marker{display:none}
.tree .cat{padding:4px 0 8px 10px}
.tree .cat summary{font-weight:400;padding:6px 0}
.tree .topics{padding:0 0 6px 12px;display:flex;flex-wrap:wrap;gap:6px}
.tree .cnt{color:var(--slate);font-weight:400;font-size:13px}
.track{display:flex;gap:10px;align-items:center;background:var(--paper-2);padding:10px 12px;border-radius:8px;margin:10px 0 16px}
.tag.off{opacity:.45;text-decoration:line-through}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.sw input{appearance:none;width:38px;height:22px;border-radius:11px;background:var(--mist);position:relative;cursor:pointer;flex:none;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:var(--green)}
.sw input:checked::after{left:19px}
.sw input:indeterminate{background:var(--amber)}
.sw input:indeterminate::after{left:11px}
.tree .tline{display:flex;align-items:center;gap:8px;padding:4px 0}
.map{position:relative;margin:10px 0 8px}
.map{position:relative}
.map svg{width:100%;height:auto;display:block;border-radius:8px;background:var(--paper-2)}
.map .nb{fill:var(--paper-3);stroke:var(--mist);stroke-width:.6;cursor:pointer}
.map .nb.on{fill:var(--blue-bg);stroke:var(--blue)}
.map .nb.full{fill:var(--green-bg);stroke:var(--green)}
.map .home{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.map .lbl{font-size:3.2px;fill:var(--slate);pointer-events:none}
.map .lbl.h{fill:var(--ink);font-weight:700;font-size:3.6px}
.map .pin{cursor:pointer}
.map .pin circle{fill:var(--paper);stroke:var(--ink);stroke-width:.7}
.map .pin.must circle{stroke:var(--red);fill:var(--red-bg)}.map .pin.affects circle{stroke:var(--blue);fill:var(--blue-bg)}
.map .pin text{font-size:3.4px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map .pin:focus-visible circle{stroke-width:1.5}
.nbrow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--paper-3);font-size:15px}
.std{font-size:12px;padding:1px 6px;border-radius:3px;background:var(--paper-3);color:var(--slate);white-space:nowrap}
.std.national{background:var(--green-bg);color:var(--green)}.std.statutory{background:var(--amber-bg);color:var(--amber)}
.ladder{display:grid;grid-template-columns:28px 1fr;gap:0 12px;margin:10px 0 0}
.rung{display:contents}
.rung .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--mist);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--slate);background:var(--paper);position:relative}
.rung .n::after{content:"";position:absolute;top:28px;left:12px;width:2px;height:calc(100% + 10px);background:var(--paper-3)}
.rung:last-child .n::after{display:none}
.rung.open .n{border-color:var(--ink);color:var(--ink)}
.rung.done .n{background:var(--green);border-color:var(--green);color:#fff}
.rung .b{padding:3px 0 18px}
.rung .t{font-weight:700;margin:0 0 2px}
.rung .d{font-size:14.5px;color:var(--slate);margin:0 0 8px}
.rung.locked .b{opacity:.5}
.asi{border:1.5px solid var(--paper-3);border-radius:8px;padding:12px 14px;margin:0 0 10px;cursor:pointer;background:var(--paper);text-align:left;width:100%}
.asi.on{border-color:var(--ink)}
.asi .h{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.asi .why{font-size:14px;color:var(--slate);margin:2px 0 0}
.asigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}

.asigrid .asi .h{flex-direction:column;align-items:flex-start;gap:2px}
.budgetline{display:flex;justify-content:space-between;gap:8px;font-size:14.5px;padding:6px 0;border-bottom:1px solid var(--paper-3)}
.areas{border:1.5px solid var(--paper-3);border-radius:8px;padding:10px 12px;margin:0 0 14px}
.areas>.h{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.set{border-top:1px solid var(--paper-3);padding:14px 0 6px;margin-top:6px;scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.set h2{margin-top:0}
.setnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.setnav a{font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);border:1.5px solid var(--paper-3);border-radius:999px;padding:4px 10px}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 10px}
.live{background:var(--paper-2);border-radius:8px;padding:10px 12px;margin:0 0 8px;font-size:15px}

.live .ok{color:var(--green);font-weight:700}.live .warn{color:var(--amber);font-weight:700}

.job .req{font-size:14px;margin:6px 0 0}
.modes{display:grid;gap:8px;margin:8px 0 14px}
.modes button{text-align:left;border:1.5px solid var(--paper-3);background:var(--paper);border-radius:8px;padding:10px 12px;cursor:pointer}
.modes button[aria-pressed="true"]{border-color:var(--ink)}
.modes b{display:block}
.map .lay{cursor:pointer}
.map .lay circle.hot{fill:var(--red);opacity:.18;stroke:var(--red);stroke-width:.4}

async function lookupCouncils(pcRaw){
  const pc=(pcRaw||"").toUpperCase().replace(/\s+/g,"");if(pc.length<2)return [];
  const full=/^[A-Z]{1,2}\d[A-Z\d]?\d[A-Z]{2}$/.test(pc);

 ribs:[
  {t:"Why",b:"To create a smoke-free generation by phasing out tobacco sales, and to make vapes less appealing to children.",s:"Explanatory notes, Tobacco and Vapes Act 2026"},
  {t:"How it got here",b:"First introduced March 2024; fell at the July 2024 general election; reintroduced November 2024; Royal Assent 8 May 2026.",s:"bills.parliament.uk, bills 3703 and 3879",link:"https://bills.parliament.uk/bills/3879"},

 id:"sanc", tables:[{t:"What the Iran regulations prohibit, and for whom",src:"Iran (Sanctions) Regulations 2023; OFSI guidance, as published",hd:["Prohibition","Who it binds"],rows:[["Dealing with funds or economic resources of a designated person","Everyone in the UK, and UK persons anywhere"],["Making funds or economic resources available to or for a designated person","Everyone in the UK"],["Export, supply or transfer of specified goods and technology (e.g. interception, drone components)","Any business or person trading those goods"],["Reporting a known or suspected designated person's funds","Relevant firms: banks, lawyers, accountants, estate agents, crypto firms, and others listed"],["Business with Iranian nationals or Iranian-owned businesses generally","Not prohibited. Nationality is not a sanctions criterion."]]}], tags:["23.7","7.4"], kind:"law", level:"uk", status:"now", date:"2023-06-14", extent:"UK",
 title:"Iran sanctions: who you can't deal with, and who you can",
 sum:"Prohibitions attach to designated persons on the UK Sanctions List, not to nationality.",
 tiers:{selfemp:"must", employee:"affects", all:"notice"},
 spine:{adult:"The Iran (Sanctions) Regulations 2023 make it an offence to deal with the funds or economic resources of anyone the Foreign Secretary has designated, or to make funds available to them. Designations are published on the UK Sanctions List and OFSI's consolidated list, both searchable. The regulations say nothing about Iranian nationals as a class: a business can trade with an Iranian person or company unless they, or their owners, are designated. Designations include individuals linked to the IRGC, drone and missile programmes, and human-rights abuses; the FCDO adds names frequently.",kid:"The government keeps a public list of specific people and organisations that UK businesses aren't allowed to send money to or trade with. The list is about named people, not about where someone is from."},
 foryou:{selfemp:"Check new customers and suppliers against the UK Sanctions List before you deal with them. Breach is a strict liability offence; OFSI can fine without proving you knew. Regulated firms must also report. Screening by nationality is not required and would breach the Equality Act.",employee:"If you work in finance, law, property or crypto you'll have a sanctions screening procedure; the law applies to you personally, not just the firm.",all:"You can check whether any person or organisation is designated. The list is public."},
 ribs:[
  {t:"Why",b:"Sanctions are a foreign-policy tool: freezing assets and cutting off trade to change the behaviour of a state or group without military action. The Iran regime targets the nuclear programme, weapons proliferation, human-rights abuses and threats to UK interests.",s:"Explanatory memorandum, Iran (Sanctions) Regulations 2023"},
  {t:"What came before",b:"Iran sanctions were EU law until 2020; the Sanctions and Anti-Money Laundering Act 2018 created the UK's own framework; the 2023 Iran regulations consolidated and widened it.",s:"SAMLA 2018; Iran (Sanctions) (EU Exit) Regulations 2019; 2023 regulations"},
  {t:"Penalties",b:"Criminal: up to 7 years for breaching an asset freeze. Civil: OFSI monetary penalties, no knowledge required since June 2022. Both can apply to individuals.",s:"SAMLA 2018; Economic Crime (Transparency and Enforcement) Act 2022"},
  {t:"The list itself",b:"The UK Sanctions List names every designated person with the regime, the reason, and the date. OFSI's consolidated list carries the asset-freeze targets with aliases and identifiers for screening.",s:"GOV.UK UK Sanctions List; OFSI consolidated list",link:"https://www.gov.uk/government/publications/the-uk-sanctions-list"},
  {t:"What's still coming",b:"New designations appear as FCDO notices; each one is a legal change on the day it's made.",s:"GOV.UK sanctions notices feed"}
 ],
 timeline:[{d:"23 May 2018",t:"UK sanctions framework",s:"past",a:"Sanctions and Anti-Money Laundering Act lets the UK make its own regimes after leaving the EU.",k:"The UK made a law to run its own sanctions.",src:"SAMLA 2018"},{d:"31 Dec 2020",t:"EU regime carried over",s:"past",a:"EU Iran sanctions became UK law at the end of transition.",k:"Old EU rules became UK rules.",src:"2019 regulations"},{d:"15 Jun 2022",t:"Strict liability",s:"past",a:"OFSI can fine for breaches without proving knowledge.",k:"You can be fined even if you didn't know.",src:"ECTE Act 2022"},{d:"14 Jun 2023",t:"Iran regulations 2023",s:"now",a:"Consolidated regime, new designation powers.",k:"The current rules.",src:"SI 2023/461"}],
 quiz:[{q:"Who does the Iran asset freeze apply to?",o:["All Iranian nationals","Designated persons on the UK Sanctions List","Anyone in Iran","Iranian-owned companies"],a:1,e:"Only designated persons. Nationality isn't a criterion, and screening by nationality would breach the Equality Act."},{q:"Can OFSI fine a business that didn't know a customer was designated?",o:["No","Yes, strict liability since 2022","Only banks","Only above £1m"],a:1,e:"Civil penalties are strict liability. The defence is a proper screening process."}]
},
{
 id:"firs", tags:["16.5","7.4"], kind:"law", level:"uk", status:"now", date:"2025-07-01", extent:"UK",
 title:"Foreign Influence Registration Scheme: Iran on the enhanced tier",
 sum:"Anyone directed by the Iranian state to act in the UK must register. Not registering is an offence.",
 tiers:{selfemp:"affects", employee:"affects", all:"notice"},
 spine:{adult:"Under Part 4 of the National Security Act 2023, a person who makes an arrangement with a foreign power to carry out political influence activity in the UK must register it. Iran was placed on the enhanced tier from 1 July 2025, which means any activity directed by the Iranian state or its agencies (including the IRGC) must be registered, political or not. The register of enhanced-tier arrangements is public. The duty falls on the person taking direction, not on anyone they deal with.",kid:"If a foreign government tells someone in the UK to do things for it, they have to tell the Home Office. For Iran, that covers everything, not just politics."},
 foryou:{selfemp:"Only relevant if you're acting on instructions from a foreign state body. If a client is, you can check the public register.",employee:"Same.",all:"The register is public: you can see who has declared arrangements with the Iranian state."},
 ribs:[{t:"Why",b:"To make covert state influence visible rather than to ban it. Registration is the obligation; transparency is the enforcement.",s:"National Security Act 2023 explanatory notes"},{t:"Penalties",b:"Failing to register on the enhanced tier: up to 5 years.",s:"NSA 2023, s.81"},{t:"The register",b:"Public register of enhanced-tier arrangements, searchable on GOV.UK.",s:"Home Office FIRS register",link:"https://www.gov.uk/government/collections/foreign-influence-registration-scheme"}],
 timeline:[{d:"11 Jul 2023",t:"National Security Act",s:"past",a:"Royal Assent; replaces the Official Secrets Acts' espionage offences and creates FIRS.",k:"A new law about spying and foreign influence.",src:"NSA 2023"},{d:"1 Jul 2025",t:"FIRS live; Iran enhanced tier",s:"now",a:"Scheme commences; Iran and Russia specified.",k:"The rules start.",src:"Commencement regulations; Iran specification regulations"}],
 quiz:[{q:"Who must register under FIRS?",o:["Anyone who talks to a foreign government","Anyone directed by a foreign power to act in the UK","All foreign nationals","Journalists"],a:1,e:"The duty attaches to being directed by a foreign power, not to nationality or contact."}]
},
{
 id:"prevent", tags:["16.2","37.1"], kind:"guidance", level:"nation", status:"now", date:"2023-12-31", extent:"England",
 title:"The Prevent duty: who it binds, and what the public can do",
 sum:"A statutory duty on schools, councils, the NHS, prisons, police and universities. Not a watchlist.",
 tiers:{employee:"affects", parent_child:"notice", all:"notice"},
 spine:{adult:"Section 26 of the Counter-Terrorism and Security Act 2015 requires specified authorities to have due regard to the need to prevent people being drawn into terrorism. Statutory guidance (revised December 2023) sets what that means in practice: training, referral routes, and the Channel panel for support. The duty binds institutions and their staff; it creates no obligation on the public and no list of people to avoid. For everyone else there is a reporting route, ACT Early, and the anti-terrorist hotline, 0800 789 321.",kid:"Schools and other public bodies have to look out for people being pulled towards violent groups and help them early. Anyone worried about someone can get advice from ACT Early."},
 foryou:{employee:"If you work in a school, council, NHS body, prison, police force or university, you'll have had Prevent training; the duty is on your employer and runs through you.",parent_child:"Schools have the duty. ACT Early gives parents advice if they're worried about a child.",all:"There is no public duty. If you're worried about someone, ACT Early is the route; it leads to support, not necessarily police action."},
 ribs:[{t:"Why",b:"Early intervention: the Channel programme is voluntary and most referrals end with no further action.",s:"Prevent duty guidance 2023; Channel duty guidance"},{t:"Proscribed organisations",b:"Separately, it's an offence to belong to, support, or display the symbols of an organisation on the proscribed list (80+ groups). The list is public and is law, not guidance.",s:"Terrorism Act 2000, Sch 2",link:"https://www.gov.uk/government/publications/proscribed-terror-groups-or-organisations--2"},{t:"The public route",b:"ACT Early (actearly.uk) for advice; 0800 789 321 for reporting; 999 if immediate.",s:"Counter Terrorism Policing"}],
 timeline:[{d:"1 Jul 2015",t:"Prevent duty",s:"past",a:"Section 26 in force for specified authorities.",k:"Public bodies given the duty.",src:"CTSA 2015"},{d:"31 Dec 2023",t:"Revised guidance",s:"now",a:"Current statutory guidance after the Shawcross review.",k:"Updated rules.",src:"Prevent duty guidance 2023"}],
 quiz:[{q:"Who does the Prevent duty legally bind?",o:["All UK residents","Specified authorities such as schools, councils and the NHS","Only the police","Faith groups"],a:1,e:"It's an institutional duty on listed public bodies, not on the public."}]
},

 title:"Drones: flyer ID, operator ID, and where you can't fly",
 sum:"Register, label the drone, keep out of restricted airspace. Temporary restrictions are made as statutory instruments.",
 tiers:{drone:"must"},
 spine:{adult:"Any drone or model aircraft over 250g, or with a camera, needs an operator ID (£11 a year) displayed on it, and the pilot needs a flyer ID from the free CAA test. Flight is limited to 120m, in sight, away from crowds and airports. Around Heathrow, Slough sits inside the flight restriction zone, so no flight without permission. Temporary restrictions for events, prisons and emergencies are made as Air Navigation (Restriction of Flying) Regulations and published on legislation.gov.uk, usually a few days ahead; from January 2026 class marking (C0 to C4) applies to new drones.",kid:"To fly a drone you need to pass a free online test and register. There are places you can never fly, like near airports, and the government sometimes bans flying somewhere for a few days."},
 foryou:{drone:"Your postcode is inside Heathrow's flight restriction zone. Check the CAA's Drone Assist map before every flight; the temporary restrictions you'll get here arrive as the SIs are made."},
 ribs:[{t:"The law",b:"Air Navigation Order 2016, arts 94–95 and 265; UK Regulation (EU) 2019/947 as retained; Air Navigation (Restriction of Flying) regulations for each temporary restriction.",s:"legislation.gov.uk",link:null},{t:"Penalties",b:"Flying in a restricted zone: up to 5 years. No ID: up to £1,000.",s:"ANO 2016; Air Traffic Management and Unmanned Aircraft Act 2021"},{t:"Where it leads",b:"Commercial operation needs a CAA operational authorisation (GVC). Survey, inspection and emergency-service drone roles exist across councils and police.",s:"CAA; Civil Service Jobs"}],

// Feed items carry real lat/lng; the schematic map needs a 0-100 xy. Inverse of xyToLatLng, clamped to the drawing. Items with no coordinates are scattered near the council centre and flagged approx.
function latLngToXy(lat,lng){const x=50+(lng-MAP_CONFIG.center[1])/0.0014,y=50-(lat-MAP_CONFIG.center[0])/0.0009;const cl=v=>Math.max(4,Math.min(96,v));return[cl(x),cl(y)];}
function placeOnMap(it){if(it.xy||it.level!=="local")return;if(it.lat!=null&&it.lng!=null){it.xy=latLngToXy(it.lat,it.lng);return;}let h=0;for(const ch of String(it.id))h=(h*31+ch.charCodeAt(0))>>>0;it.xy=[44+(h%1300)/100,42+((h>>>8)%1600)/100];it.approx=true;}
function xyToLatLng(xy){return [MAP_CONFIG.center[0]+(50-xy[1])*0.0009,MAP_CONFIG.center[1]+(xy[0]-50)*0.0014];}

function topicsOf(level,key){ // level: "dom"|"cat"|"topic"
  if(level==="topic")return [key];
  if(level==="cat"){const C=TAX.flatMap(D=>D.cats).find(C=>C.n===+key);return C?C.topics.map((_,i)=>C.n+"."+(i+1)):[];}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(d){return new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}

function tierFor(it){ // highest tier that applies to this profile
  const order={must:3,affects:2,notice:1};let best=null,who=null;
  for(const [s,t] of Object.entries(it.tiers)){ if(s==="all"||has(s)){ if(!best||order[t]>order[best]){best=t;who=s;} } }

}

// ---------- Timed sessions ----------
let sessT=null;
let session=null; // {mins,end,ids,done}
function renderSession(mins){
  const tc=toCurrent();let budget=mins,pick=[];for(const it of tc.list){const m=minsFor(it);if(budget-m>=0){pick.push(it);budget-=m;}}
  session={mins,end:Date.now()+mins*60000,ids:pick.map(it=>it.id),more:tc.list.length-pick.length,moreMins:tc.list.slice(pick.length).reduce((n,it)=>n+minsFor(it),0),from:prevTab,done:false};
  drawSession();
}
function drawSession(){
  const S=session;if(!S)return;const s=document.getElementById("s-detail");
  const pick=S.ids.map(id=>ITEMS.find(x=>x.id===id)).filter(Boolean);const read=pick.filter(it=>game.got["read:"+it.id]);
  const extra=S.mins>=30?[{t:"One lesson from an area of specific interest",m:5},{t:"A round of Law or Lore",m:4},{t:"Scrub a timeline end to end",m:2}]:[{t:"One quiz question",m:1}];
  s.innerHTML=`<div class="detail-head"><button class="back" id="back">‹ Back</button></div><div class="timer"><span>${S.mins}-minute catch-up · ${read.length}/${pick.length} read</span><b id="left">${S.mins}:00</b></div>
  <h1>${pick.length?`${pick.length} item${pick.length>1?"s":""}, duties first.`:"You're current."}</h1><p class="lede">${pick.length?`Reading time is estimated from the text, about ${pick.reduce((n,it)=>n+minsFor(it),0)} minutes. Open each; it's marked read when you do, and the clock keeps running while you read.`:"Use the time on a lesson or a quiz instead."}</p>
  ${pick.map(it=>card(it).replace('<div class="meta">',`<div class="meta"><span class="lead">${minsFor(it)} min${game.got["read:"+it.id]?" · ✓ read":""}</span>`)).join("")}
  ${S.more>0?`<p class="note">${S.more} more unread after this session; about ${S.moreMins} minutes.</p>`:""}
  <h2>If there's time left</h2>${extra.map(e=>`<div class="live"><div class="st"><span>${esc(e.t)}</span><span class="lead">${e.m} min</span></div></div>`).join("")}
  <div class="row" style="margin-top:12px"><button class="btn ghost sm" id="endsess">End session</button></div>
  <p class="mantra">${esc(mantra())}</p>`;
  s.querySelector("#back").onclick=()=>{show(S.from);};
  s.querySelector("#endsess").onclick=()=>{clearInterval(sessT);session=null;show(S.from);};
  bindCards(s);tickSession();
  clearInterval(sessT);sessT=setInterval(tickSession,500);

}
function tickSession(){const S=session;if(!S){clearInterval(sessT);return;}const l=Math.max(0,S.end-Date.now());const el=document.getElementById("left");if(el)el.textContent=Math.floor(l/60000)+":"+String(Math.floor(l%60000/1000)).padStart(2,"0");

function sessionLive(){return session&&!session.done&&session.end>Date.now();}

let LMAP=null;
function mapFallback(s,msg){const el=s.querySelector("#realmap");const sch=s.querySelector(".map");if(el)el.innerHTML=`<div class="mapmsg">${esc(msg)}</div>`;if(sch)sch.style.display="";}
async function realMap(s,pins,layerPins,orders){

  if(LMAP){LMAP.remove();LMAP=null;}

  tl.on("tileload",()=>{tileOk++;});
  tl.on("tileerror",()=>{tileErr++;if(tileErr>=4&&tileOk===0){const n=document.createElement("div");n.className="mapmsg over";n.textContent="Ordnance Survey tiles aren't loading. Usually the API key isn't allowed on this web address, or there's no connection. The pins still work; the schematic map is below.";el.appendChild(n);const sch=s.querySelector(".map");if(sch)sch.style.display="";}});
  if(profile&&profile.lat!=null){L.circleMarker([profile.lat,profile.lng],{radius:7,color:"#0b0c0c",fillColor:"#ffffff",fillOpacity:1,weight:3}).addTo(LMAP).bindTooltip("Your postcode");if(profile.radius)L.circle([profile.lat,profile.lng],{radius:profile.radius*1609.34,color:"#0b0c0c",weight:1,dashArray:"4 4",fill:false}).addTo(LMAP);}
  // Council boundary: a GeoJSON file in /boundaries/<council>.geojson, cut from ONS Boundary-Line (free). Falls back to nothing.
  try{const r=await fetch("./boundary-"+encodeURIComponent(profile.council.replace(/ /g,"_"))+".geojson");if(r.ok){const gj=await r.json();L.geoJSON(gj,{style:{color:"#0b0c0c",weight:2.5,fill:false}}).addTo(LMAP);}}catch(e){}
  const mk=(ll,cls,ic,title,onclick)=>{const m=L.marker(ll,{icon:L.divIcon({className:"",html:`<div class="pinhtml ${cls}" title="${esc(title)}">${ic}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}).addTo(LMAP);m.on("click",onclick);return m;};
  const markers=[];const cl=L.layerGroup().addTo(LMAP);
  const drawClusters=()=>{cl.clearLayers();const z=LMAP.getZoom();markers.forEach(m=>{z>=13?m.addTo(LMAP):LMAP.removeLayer(m);});if(z>=13)return;
    const all=[...pins.map(it=>({layer:"law",ic:iconFor(Object.assign({layer:"law"},it)),ll:it.lat?[it.lat,it.lng]:xyToLatLng(it.xy)})),...layerPins.map(({P})=>({layer:P.layer,ic:iconFor(P),ll:P.lat?[P.lat,P.lng]:xyToLatLng(P.xy)}))];
    if(z<12){const g=clusterRows(all.map(a=>Object.assign({label:""},a)));const c=LMAP.getCenter();g.forEach((r,i)=>{const a=-90+i*(360/g.length);const ll=[c.lat+0.012*Math.sin(a*Math.PI/180),c.lng+0.03*Math.cos(a*Math.PI/180)];L.marker(ll,{icon:L.divIcon({className:"",html:`<div class="pinhtml" style="width:44px;height:44px;background:var(--ink);color:#fff;border-color:var(--ink);font-size:16px;font-weight:700" title="${esc(r.name)}">${r.n}</div>`,iconSize:[44,44],iconAnchor:[22,22]})}).on("click",()=>LMAP.setView(ll,13)).addTo(cl);});return;}
    const b=LMAP.getBounds(),c=b.getCenter();const q={};all.forEach(a=>{const k=(a.ll[0]>c.lat?"N":"S")+(a.ll[1]<c.lng?"W":"E");(q[k]=q[k]||[]).push(a);});Object.entries(q).forEach(([k,rows])=>{const ll=[c.lat+(k[0]==="N"?1:-1)*(b.getNorth()-c.lat)/2,c.lng+(k[1]==="E"?1:-1)*(b.getEast()-c.lng)/2];const by={};rows.forEach(a=>by[a.ic]=(by[a.ic]||0)+1);const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3).map(t=>t[0]+t[1]).join(" ");L.marker(ll,{icon:L.divIcon({className:"",html:`<div class="pinhtml" style="width:auto;padding:0 10px;border-radius:18px;height:36px;background:var(--ink);color:#fff;border-color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap">${rows.length} <span style="font-weight:400;font-size:12px;margin-left:6px">${top}</span></div>`,iconSize:[1,36],iconAnchor:[0,18]})}).on("click",()=>LMAP.setView(ll,LMAP.getZoom()+2)).addTo(cl);});};
  const mkq=(ll,cls,ic,title,onclick)=>{const m=L.marker(ll,{icon:L.divIcon({className:"",html:`<div class="pinhtml ${cls}" title="${esc(title)}">${ic}</div>`,iconSize:[28,28],iconAnchor:[14,14]})});m.on("click",onclick);markers.push(m);return m;};
  pins.forEach(it=>{const r=tierFor(it);const S=LOCAL_SOURCES.find(x=>x.k===it.src)||{ic:"•"};mkq(it.lat?[it.lat,it.lng]:xyToLatLng(it.xy),r.tier,S.ic,it.title,()=>renderDetail(it.id));});

    mkq(P.lat?[P.lat,P.lng]:xyToLatLng(P.xy),"",iconFor(P),P.t,()=>{pinSel=i;ordSel=null;again();});});

  }catch(e){mapFallback(s,"The map hit an error: "+(e&&e.message||e)+". Showing the schematic map instead.");}
}

  ${items.length?items.map(card).join(""):`<div class="allclear"><span class="tick">✓</span><div>Nothing published under this topic yet in the prototype.</div></div>`}
  <h2>Nearby topics</h2><div class="tags">${Object.keys(TOPIC).filter(k=>TOPIC[k].n===T.n&&k!==code).map(k=>tagHTML(k)).join("")}</div>`;

function startLoL(){

  function ask(){

    box.innerHTML=`<div class="score"><span>Run <b>${run}</b></span><span>Streak <b>${streak}</b></span><span>${i+1}/${deck.length}</span></div><div class="meter"><i style="width:100%"></i></div><div class="big popin">${esc(Q.s)}</div><div class="ab"><button class="law" id="lA">Law<span>A</span></button><button class="lore" id="lB">Lore<span>B</span></button></div>`;

    clearInterval(timer);timer=setInterval(()=>{const p=1-(performance.now()-t0)/8000;const m=box.querySelector(".meter i");if(m)m.style.width=Math.max(0,p*100)+"%";if(p<=0){clearInterval(timer);miss("Out of time.");}},50);

  function scrub(dir){const r=document.querySelector("#tl input[type=range]");if(!r)return;r.value=Math.max(+r.min,Math.min(+r.max,+r.value+dir));r.dispatchEvent(new Event("input"));r.scrollIntoView({block:"center",behavior:"smooth"});}
  // re-acquire focus after screens re-render
  const mo=new MutationObserver(()=>{if(focusEl&&!document.contains(focusEl)){focusEl=null;}});mo.observe(document.getElementById("app"),{childList:true,subtree:true});
  function edge(name,down,repeatMs){ // true on press, and on hold-repeat if repeatMs given
    const now=performance.now();
    if(down&&!prev[name]){prev[name]=true;rep[name]=now+(repeatMs?350:1e9);return true;}
    if(down&&repeatMs&&now>rep[name]){rep[name]=now+repeatMs;return true;}
    if(!down)prev[name]=false;return false;
  }
  function poll(){
    const pads=navigator.getGamepads?navigator.getGamepads():[];let gp=null;for(const p of pads){if(p&&p.connected){gp=p;break;}}
    if(gp){
      if(!active){active=true;hud.style.display="block";hud.textContent="Controller: D-pad move · A select · B back · L1/R1 tabs · right stick scroll · triggers timeline";setTimeout(()=>hud.style.display="none",4000);if(!focusEl)move(1);}
      const b=i=>gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>0.5);
      const ax=i=>gp.axes[i]||0;
      if(edge("up",b(12)||ax(1)<-0.5,160))move(-1);
      if(edge("down",b(13)||ax(1)>0.5,160))move(1);
      if(edge("left",b(14)||ax(0)<-0.5,200))moveSide(-1);
      if(edge("right",b(15)||ax(0)>0.5,200))moveSide(1);
      if(edge("a",b(0))){if(lol&&document.querySelector("#lolbox #lA"))lol.answer(true);else if(lol&&lol.next&&document.querySelector("#lolbox #nx"))lol.next();else press();}
      if(edge("b",b(1))){if(lol&&document.querySelector("#lolbox #lA"))lol.answer(false);else back();}
      if(edge("l1",b(4)))tab(-1);
      if(edge("r1",b(5)))tab(1);
      if(edge("lt",b(6),220))scrub(-1);
      if(edge("rt",b(7),220))scrub(1);
      if(edge("x",b(2))){const l=document.getElementById("listen");if(l)l.click();}
      if(edge("y",b(3))){const o=document.querySelector(".screen.active .quiz, #quiz");if(o){o.scrollIntoView({block:"start",behavior:"smooth"});const f=o.querySelector("button");if(f)setFocus(f);}}
      const ry=ax(3);if(Math.abs(ry)>0.2)window.scrollBy(0,ry*18);
    } else if(active){active=false;if(focusEl)focusEl.classList.remove("pad-focus");focusEl=null;}
    requestAnimationFrame(poll);
  }
  window.addEventListener("gamepadconnected",()=>{hud.style.display="block";});
  requestAnimationFrame(poll);
  // keyboard fallback: arrows / Enter / Escape mirror the pad
  document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"&&e.target.type!=="checkbox"&&e.target.type!=="range")return;
    if(e.key==="ArrowDown"){e.preventDefault();move(1);}else if(e.key==="ArrowUp"){e.preventDefault();move(-1);}else if(e.key==="ArrowLeft"){moveSide(-1);}else if(e.key==="ArrowRight"){moveSide(1);}else if(e.key==="Escape"){back();}else if(e.key==="["){tab(-1);}else if(e.key==="]"){tab(1);}});
})();
</script>
